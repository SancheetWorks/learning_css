<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Text Format</title>
        <link href="css/text_format.css" rel="stylesheet" type="text/css">
    </head>
    <body>
        <h1 class="t_transform_uppercase">Hello, my Name is Sancheet</h1>
        <h1 class="t_transform_lowercase">Hello, my Name is Sancheet</h1>
        <h1 class="t_transform_capitalize">Hello, my Name is Sancheet</h1>

        <hr>

        <h1 class="t_decor_overline">Hello, my Name is Sancheet</h1>
        <h1 class="t_decor_underline">Hello, my Name is Sancheet</h1>
        <h1 class="t_decor_linethrough">Hello, my Name is Sancheet</h1>
        <h1 class="t_decor_all">Hello, my Name is Sancheet</h1>

        <hr>

        <h1 class="t_align_l">Hello, my Name is Sancheet</h1>
        <h1 class="t_align_c">Hello, my Name is Sancheet</h1>
        <h1 class="t_align_r">Hello, my Name is Sancheet</h1>

        <hr>

        <h1 class="t_shadow1">Sancheet</h1>
        <h1 class="t_shadow2">Sancheet</h1>

        <hr>
    </body>
</html>
