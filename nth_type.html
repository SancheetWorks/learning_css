    <title>nth type</title>
    <link href="css/nth_type.css" rel="stylesheet" type="text/css" />
</head>
<body>
    <!-- This formula will display the following UL list "ul>li*8{Item $}" -->

        <li class="li_property">Item 1</li>
        <li class="li_property">Item 2</li>
        <li class="li_property">Item 3</li>
        <li class="li_property">Item 4</li>
        <li class="li_property">Item 5</li>
        <li class="li_property">Item 6</li>
        <li class="li_property">Item 7</li>
        <li class="li_property">Item 8</li>
    </ul>
</body>
</html>
