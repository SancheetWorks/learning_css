<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <link href="css/class_id_selectors.css" rel="stylesheet"
            type="text/css">
    </head>
    <body>

        <!-- Class Selector -->
        <!-- Multiple classe names can be given for style  -->
        <h5 class="heading5 heading_color">Hello Everyone, this is a boy this
            side.</h5>
        <h6 class="heading6">I like to Dance and sing.</h6>

        <!-- ID Selector -->
        <!-- Only one heading name can be given to the id for styling name -->
        <h1 id="heading5">Hello I am Sancheet</h5>
        <h2 id="heading6">Hello I am Sancheet</h2>
    </body>
</html>
